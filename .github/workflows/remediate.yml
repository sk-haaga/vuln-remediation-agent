# Runs the agent on a Python project in this repository.
#
# Defaults point at one of the test repositories in eval/fixtures so you can watch
# it work. To use it on a real project, copy this file into that repository and set
# PROJECT_DIR / TEST_COMMAND, or call it on a schedule.
#
# Safety: the job can open pull requests and issues, but it cannot merge.
# Protect your default branch (require a review) so that stays true for any token.

name: Remediate vulnerable dependencies

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: Folder containing requirements.txt and the tests
        default: eval/fixtures/auth-service
      test_command:
        description: Command that runs the tests
        default: python -m pytest -q
      scan_image:
        description: Build the project's Dockerfile and scan it with Trivy
        type: boolean
        default: true
      dry_run:
        description: Only write the would-be PRs/issues as an artifact
        type: boolean
        default: true
  # schedule:
  #   - cron: "17 6 * * 1"   # Mondays 06:17 UTC

permissions:
  contents: write       # push vra/* branches
  pull-requests: write  # open pull requests (never merge)
  issues: write         # escalate to a person

concurrency:
  group: remediate
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ${{ inputs.project_dir || 'eval/fixtures/auth-service' }}
      TEST_COMMAND: ${{ inputs.test_command || 'python -m pytest -q' }}
      SCAN_IMAGE: ${{ inputs.scan_image == false && 'false' || 'true' }}
      DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the agent
        run: pip install .

      - name: Install Trivy (pinned, checksum verified)
        if: env.SCAN_IMAGE == 'true'
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build and scan the container image
        if: env.SCAN_IMAGE == 'true'
        run: |
          if [ ! -f "$PROJECT_DIR/Dockerfile" ]; then echo "No Dockerfile in $PROJECT_DIR; skipping image scan"; exit 0; fi
          docker build -t vra-target:scan "$PROJECT_DIR"
          trivy image --quiet --scanners vuln --format json --output "$RUNNER_TEMP/trivy.json" vra-target:scan
          echo "TRIVY_REPORT=$RUNNER_TEMP/trivy.json" >> "$GITHUB_ENV"

      - name: Run the agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          args=(--repo . --project-dir "$PROJECT_DIR" --test-command "$TEST_COMMAND" --out vra-output)
          [ -n "${TRIVY_REPORT:-}" ] && args+=(--trivy-report "$TRIVY_REPORT")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          vra "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vra-output
          path: vra-output
